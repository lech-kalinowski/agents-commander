name: Bug report
description: Report a reproducible problem in Agents Commander.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please use a minimal, sanitized example. Do not attach API keys, live protocol capability keys, private prompts, raw transcripts, captures or datasets. Private logs are not required. Do not report an unpatched security vulnerability in a public issue.
  - type: input
    id: version
    attributes:
      label: Commander version and installation
      description: Include the version and whether you use an npm install or a source build. For source builds, include the commit or branch if known.
      placeholder: "Source 0.1.5, commit abc1234; launched with node dist/bin/agents-commander.js"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Runtime and terminal environment
      description: Include OS/version, Node.js version, Python version, terminal application and affected agent CLI/version. Add window size or hardware connection details if relevant; omit device serial numbers.
      placeholder: "macOS / Linux / WSL2; Node.js; Python; terminal; agent CLI"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest steps and exact keys or commands that reproduce the problem, using placeholders for private paths and credentials.
      placeholder: |
        1. Launch Commander with ...
        2. Open ...
        3. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead? Include sanitized error text if useful. Describe whether it happens every time or intermittently.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Relevant workarounds, regression information or a sanitized screenshot. Do not upload private logs or session recordings.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this report and its attachments for secrets, live capability keys and private session data.
          required: true
