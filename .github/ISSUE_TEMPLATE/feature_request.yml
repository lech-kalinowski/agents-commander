name: Feature request
description: Propose an improvement to a specific user workflow.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing an implementation. Keep examples free of credentials, live protocol capability keys and private session data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to accomplish, and what is difficult with the current behavior?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what a successful improvement would let you do. Include an example interaction if useful.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Expected scope and limits
      description: Which part of Commander would change? What should stay unchanged? Identify any provider, hardware, privacy or compatibility requirements.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Describe existing workflows or smaller changes that could solve the problem.
  - type: input
    id: version
    attributes:
      label: Version and installation (optional)
      description: Which Commander version have you tried, and was it an npm install or a source build?
